# Render Blueprint: Docker web service + managed Postgres.
# New → Blueprint → point at this repo.
services:
  - type: web
    name: entente
    runtime: docker
    plan: starter        # free instances sleep, which pauses phase deadlines
    healthCheckPath: /healthz
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: entente-db
          property: connectionString
databases:
  - name: entente-db
    plan: basic-256mb
